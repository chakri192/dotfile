<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="2.6" orient="auto"><path d="M0,0 L6.5,2.6 L0,5.2 z" fill="#6b7688"/></marker>
  </defs>
  <style>
    .p { font-family: SFMono-Regular,Menlo,Consolas,monospace; font-size: 10.5px; }
    .d { font-size: 9.5px; fill: #8a9bb4; }
  </style>

  <rect width="880" height="440" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="439" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">WHAT GOES WHERE</text>
  <text x="852" y="38" font-size="11" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">macOS · Apple Silicon</text>

  <text x="44" y="66" font-size="10" font-weight="700" fill="#5d6675" letter-spacing="1">IN THE REPO</text>
  <text x="480" y="66" font-size="10" font-weight="700" fill="#5d6675" letter-spacing="1">ON THE MACHINE</text>

  <!-- rows -->
  <g>
    <!-- scripts -->
    <rect x="28" y="78" width="200" height="46" rx="7" fill="#12151b" stroke="#7ddc8b" stroke-width="1.2"/>
    <text x="42" y="97" class="p" fill="#7ddc8b">scripts/</text>
    <text x="42" y="113" class="d">5 zsh tools</text>
    <line x1="232" y1="101" x2="470" y2="101" stroke="#6b7688" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="351" y="95" font-size="8.5" fill="#5d6675" text-anchor="middle">added to $PATH</text>
    <rect x="476" y="78" width="376" height="46" rx="7" fill="#0f1319" stroke="#39414f" stroke-width="1.1"/>
    <text x="490" y="97" class="p" fill="#e6edf3">~/.zshenv</text>
    <text x="490" y="113" class="d">export PATH="$HOME/Documents/portfolio/dotfile/scripts:$PATH"</text>

    <!-- nvim -->
    <rect x="28" y="132" width="200" height="46" rx="7" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
    <text x="42" y="151" class="p" fill="#5fd0de">nvim/</text>
    <text x="42" y="167" class="d">init.lua + 13 plugin modules</text>
    <line x1="232" y1="155" x2="470" y2="155" stroke="#6b7688" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="351" y="149" font-size="8.5" fill="#5d6675" text-anchor="middle">symlinked</text>
    <rect x="476" y="132" width="376" height="46" rx="7" fill="#0f1319" stroke="#39414f" stroke-width="1.1"/>
    <text x="490" y="151" class="p" fill="#e6edf3">~/.config/nvim</text>
    <text x="490" y="167" class="d">a symlink, so edits in the repo are live immediately</text>

    <!-- vscode -->
    <rect x="28" y="186" width="200" height="46" rx="7" fill="#12151b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="42" y="205" class="p" fill="#a78bfa">vscode/</text>
    <text x="42" y="221" class="d">settings + 20 extensions</text>
    <line x1="232" y1="209" x2="470" y2="209" stroke="#6b7688" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="351" y="203" font-size="8.5" fill="#5d6675" text-anchor="middle">copied</text>
    <rect x="476" y="186" width="376" height="46" rx="7" fill="#0f1319" stroke="#39414f" stroke-width="1.1"/>
    <text x="490" y="205" class="p" fill="#e6edf3">~/Library/Application Support/Code/User/</text>
    <text x="490" y="221" class="d">extensions installed from extensions.json</text>

    <!-- zen -->
    <rect x="28" y="240" width="200" height="46" rx="7" fill="#12151b" stroke="#f0b866" stroke-width="1.2"/>
    <text x="42" y="259" class="p" fill="#f0b866">zen/</text>
    <text x="42" y="275" class="d">user.js · chrome CSS · themes</text>
    <line x1="232" y1="263" x2="470" y2="263" stroke="#6b7688" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="351" y="257" font-size="8.5" fill="#5d6675" text-anchor="middle">copied</text>
    <rect x="476" y="240" width="376" height="46" rx="7" fill="#0f1319" stroke="#39414f" stroke-width="1.1"/>
    <text x="490" y="259" class="p" fill="#e6edf3">&lt;zen profile&gt;/  and  &lt;zen profile&gt;/chrome/</text>
    <text x="490" y="275" class="d">needs legacyUserProfileCustomizations.stylesheets = true</text>

    <!-- launchagents -->
    <rect x="28" y="294" width="200" height="46" rx="7" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
    <text x="42" y="313" class="p" fill="#e6edf3">macos/launchagents/</text>
    <text x="42" y="329" class="d">Caps Lock → Right Cmd</text>
    <line x1="232" y1="317" x2="470" y2="317" stroke="#6b7688" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="351" y="311" font-size="8.5" fill="#5d6675" text-anchor="middle">copied + loaded</text>
    <rect x="476" y="294" width="376" height="46" rx="7" fill="#0f1319" stroke="#39414f" stroke-width="1.1"/>
    <text x="490" y="313" class="p" fill="#e6edf3">~/Library/LaunchAgents/</text>
    <text x="490" y="329" class="d">native hidutil — no Karabiner needed</text>

    <!-- services -->
    <rect x="28" y="348" width="200" height="46" rx="7" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
    <text x="42" y="367" class="p" fill="#e6edf3">services/ · macos/automator/</text>
    <text x="42" y="383" class="d">3 Finder Quick Actions</text>
    <line x1="232" y1="371" x2="470" y2="371" stroke="#6b7688" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="351" y="365" font-size="8.5" fill="#5d6675" text-anchor="middle">copied</text>
    <rect x="476" y="348" width="376" height="46" rx="7" fill="#0f1319" stroke="#39414f" stroke-width="1.1"/>
    <text x="490" y="367" class="p" fill="#e6edf3">~/Library/Services/</text>
    <text x="490" y="383" class="d">New Item · Send to Gmail · Send to Ollama</text>
  </g>

  <line x1="28" y1="410" x2="852" y2="410" stroke="#2b313d"/>
  <text x="28" y="430" class="d" fill="#7d8899">Only <tspan font-family="SFMono-Regular,Menlo,monospace" fill="#5fd0de">nvim/</tspan> is symlinked. Everything else is copied, so updating the repo does not update your machine — re-copy after a pull.</text>
</svg>
