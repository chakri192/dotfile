# ~/.config/tmux/tmux.conf
# Reload after editing: prefix + r (bound below)

# ─── Prefix ────────────────────────────────────────────────────────────────
# C-a instead of the default C-b — frees C-b, and matches screen muscle
# memory. Sent twice (C-a C-a) to pass a literal C-a through to a nested
# session or another program.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Terminal ──────────────────────────────────────────────────────────────
# True color + undercurl for Ghostty.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# The standard tmux+vim fix — without this, Esc in vi-mode / nvim has a
# noticeable lag because tmux waits to see if more escape-sequence bytes
# are coming.
set -sg escape-time 10

# ─── General ───────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g focus-events on

# ─── Copy mode ─────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ─── Splits & panes ────────────────────────────────────────────────────────
# | and - instead of the default % and " — same mnemonic as the ghostty
# config's cmd+d (split right) / cmd+shift+d (split down).
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New windows/panes open in the current pane's directory.
bind c new-window -c "#{pane_current_path}"

# Quick reload.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─── Status line ───────────────────────────────────────────────────────────
# Hand-rolled, no plugin manager — styled to the vivid-on-black ghostty
# palette (see ghostty/.config/ghostty/config).
set -g status-position bottom
set -g status-style bg=#000000,fg=#abb2bf
set -g status-left-length 30
set -g status-right-length 60

set -g status-left "#[fg=#61afef,bold] #S #[fg=#5c6370]│ "
set -g status-right "#[fg=#5c6370]#{?client_prefix,#[fg=#e5c07b]PREFIX ,}#[fg=#5c6370]│ #[fg=#98c379]#h #[fg=#5c6370]│ #[fg=#abb2bf]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#61afef,bold] #I:#W "

set -g pane-border-style fg=#3a3a3a
set -g pane-active-border-style fg=#61afef

set -g message-style bg=#61afef,fg=#000000
