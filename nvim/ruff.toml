# Global Ruff defaults. Referenced by conform + ruff LSP via --config / settings.
# Symlink to ~/.config/ruff/ruff.toml to make bare `ruff` use it everywhere.
line-length = 100
target-version = "py313"

[lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM simplify, C4 comprehensions, PL pylint-subset
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PL"]
ignore = ["E501"]  # line length handled by the formatter

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
